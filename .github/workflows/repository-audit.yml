name: Repository Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Audit repository metadata and Markdown links
        run: python3 scripts/check_repository.py
      - name: Audit tracked-file documentation coverage
        run: python3 scripts/check_documentation_coverage.py
      - name: Audit Android string resource references
        run: python3 scripts/check_android_resources.py
