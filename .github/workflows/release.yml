name: Release Candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Check formatting
        run: python3 scripts/check_format.py

      - name: Check Kotlin namespace declarations
        run: python3 scripts/check_kotlin_namespace.py

      - name: Check tracked-file documentation coverage
        run: python3 scripts/check_documentation_coverage.py

      - name: Check Android string resource references
        run: python3 scripts/check_android_resources.py

      - name: Check Android local-first security policy
        run: python3 scripts/check_android_security.py

      - name: Verify repository metadata and links
        run: python3 scripts/check_repository.py

      - name: Scan repository for common secret patterns
        run: python3 scripts/scan_secrets.py

      - name: Unit tests
        run: gradle --no-daemon clean testDebugUnitTest

      - name: Compile instrumentation tests
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Android lint
        run: gradle --no-daemon lint

      - name: Release compilation
        run: gradle --no-daemon assembleRelease

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spendcalc-${{ github.ref_name }}-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
