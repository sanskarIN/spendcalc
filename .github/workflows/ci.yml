name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, lint, format, security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Check formatting
        run: python3 scripts/check_format.py

      - name: Check Kotlin namespace declarations
        run: python3 scripts/check_kotlin_namespace.py

      - name: Scan repository for common secret patterns
        run: python3 scripts/scan_secrets.py

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Debug build
        run: gradle --no-daemon assembleDebug

      - name: Release compilation
        run: gradle --no-daemon assembleRelease

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/
          if-no-files-found: ignore
