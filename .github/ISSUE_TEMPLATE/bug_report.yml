name: Bug report
description: Report a reproducible SpendCalc defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SpendCalc. Remove personal or sensitive information from screenshots/logs.
  - type: input
    id: version
    attributes:
      label: SpendCalc version or commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android/device environment
      placeholder: "Android 15, Pixel emulator"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Do not include private data, credentials, signing material, or payment details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed personal/sensitive information from anything I attached.
          required: true
